[project]
name = "sistema-web-p2p-backend"
version = "1.0.0"
description = "Backend RESTful FastAPI para Sistema Web P2P EPIS-UPT"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic-settings>=2.5.0",
    "pydantic>=2.9.0",
    "SQLAlchemy>=2.0.0",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.13.0",
    "httpx>=0.27.0",
    "pyjwt>=2.9.0",
    "openpyxl>=3.1.5",
    "reportlab>=4.2.5",
    "qrcode>=8.0",
    "PyPDF2>=3.0.0",
    "PyMuPDF>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
]
ignore = [
    "B008",   # do not perform function calls in argument defaults (FastAPI Depends)
    "E501",   # line length handled by ruff format / long literal strings
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --cov=app --cov-report=term-missing --cov-report=xml"

[tool.coverage.run]
source = ["app"]
omit = [
    "app/db/migrations/*",
]

[tool.coverage.report]
show_missing = true
fail_under = 70
